name: Conferences API - CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/Conferences/**'
      - 'src/Shared/**'
      - '.github/workflows/conferences-api-ci-cd.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  PROJECT_PATH: 'src/Conferences/HexMaster.Attendr.Conferences.Api/HexMaster.Attendr.Conferences.Api.csproj'
  TEST_PROJECT_PATH: 'src/Conferences/HexMaster.Attendr.Conferences.Tests/HexMaster.Attendr.Conferences.Tests.csproj'
  DOTNET_VERSION: '10.0.x'

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      assemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}
      informationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for GitVersion

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.2.0
        with:
          versionSpec: '6.4.x'
          
      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.2.0

      - name: Display GitVersion outputs
        run: |
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"

  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: |
          dotnet build ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --no-restore

      - name: Test
        run: |
          dotnet test ${{ env.TEST_PROJECT_PATH }} \
            --configuration Release \
            --no-build \
            --verbosity normal

  publish-deploy:
    name: Publish and Deploy
    runs-on: ubuntu-latest
    needs: [version, build-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_PROD_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_PROD_TENANTID }}
          subscription-id: ${{ secrets.AZURE_PROD_SUBSCRIPTION }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.CONTAINER_REGISTRY_USERNAME }}

      - name: Build Bicep templates to JSON
        working-directory: src/Conferences/Infrastructure
        run: |
          # Build main Bicep template
          az bicep build --file bicep/main.bicep --outfile bicep/main.json
          
          # Build parameter files
          az bicep build-params --file parameters/main.prod.bicepparam --outfile parameters/main.prod.parameters.json

      - name: Publish container
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --os linux \
            --arch x64 \
            /t:PublishContainer \
            /p:ContainerRegistry=${{ secrets.CONTAINER_REGISTRY_HOSTNAME }} \
            /p:ContainerImageTag=${{ needs.version.outputs.semVer }} \
            /p:Version=${{ needs.version.outputs.assemblySemVer }} \
            /p:AssemblyVersion=${{ needs.version.outputs.assemblySemVer }} \
            /p:InformationalVersion=${{ needs.version.outputs.informationalVersion }}

      - name: Image details
        run: |
          echo "### Container Image Published :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ secrets.CONTAINER_REGISTRY_HOSTNAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** attendr/attendr-conferences-api" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ needs.version.outputs.semVer }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.version.outputs.informationalVersion }}" >> $GITHUB_STEP_SUMMARY

      - name: Deploy to Azure Container Apps
        run: |
          az deployment sub create \
            --name "conferences-deploy-${{ github.run_number }}" \
            --location northeurope \
            --template-file src/Conferences/Infrastructure/bicep/main.json \
            --parameters src/Conferences/Infrastructure/parameters/main.prod.parameters.json \
            --parameters containerImage="${{ secrets.CONTAINER_REGISTRY_HOSTNAME }}/attendr/attendr-conferences-api:${{ needs.version.outputs.semVer }}" \
            --parameters containerRegistryServer="${{ secrets.CONTAINER_REGISTRY_HOSTNAME }}" \
            --parameters containerRegistryUsername="${{ secrets.CONTAINER_REGISTRY_USERNAME }}" \
            --parameters containerRegistryPassword="${{ secrets.CONTAINER_REGISTRY_PASSWORD }}" \

      - name: Get deployment outputs
        working-directory: src/Conferences/Infrastructure
        run: |
          DEPLOYMENT_NAME=$(az deployment sub list --query "[?contains(name, 'conferences-deploy')].name" -o tsv | head -n 1)
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Infrastructure Deployed :cloud:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment:** $DEPLOYMENT_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          az deployment sub show \
            --name "$DEPLOYMENT_NAME" \
            --query properties.outputs
