name: Profiles API - CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/Profiles/**'
      - 'src/Shared/**'
      - '.github/workflows/profiles-api-ci-cd.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  PROJECT_PATH: 'src/Profiles/HexMaster.Attendr.Profiles.Api/HexMaster.Attendr.Profiles.Api.csproj'
  TEST_PROJECT_PATH: 'src/Profiles/HexMaster.Attendr.Profiles.Tests/HexMaster.Attendr.Profiles.Tests.csproj'
  DOTNET_VERSION: '10.0.x'

jobs:
  build-test-publish:
    name: Build, Test and Publish
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for GitVersion

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.2.0
        with:
          versionSpec: '6.4.x'
          
      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.2.0

      - name: Display GitVersion outputs
        run: |
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: |
          dotnet build ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --no-restore \
            /p:Version=${{ steps.gitversion.outputs.assemblySemVer }} \
            /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} \
            /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_PROD_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_PROD_TENANTID }}
          subscription-id: ${{ secrets.AZURE_PROD_SUBSCRIPTION }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.CONTAINER_REGISTRY_USERNAME }}

      - name: Publish container
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --os linux \
            --arch x64 \
            /t:PublishContainer \
            /p:ContainerRegistry=${{ secrets.CONTAINER_REGISTRY_HOSTNAME }} \
            /p:ContainerImageTag=${{ steps.gitversion.outputs.semVer }} \
            /p:Version=${{ steps.gitversion.outputs.assemblySemVer }} \
            /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} \
            /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: Image details
        run: |
          echo "### Container Image Published :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ secrets.CONTAINER_REGISTRY_HOSTNAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** attendr/attendr-profiles-api" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.gitversion.outputs.semVer }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.gitversion.outputs.informationalVersion }}" >> $GITHUB_STEP_SUMMARY

      - name: Deploy to Azure Container Apps
        run: |
          az deployment sub create \
            --name "profiles-deploy-${{ github.run_number }}" \
            --location northeurope \
            --template-file src/Profiles/infrastructure/bicep/main.bicep \
            --parameters src/Profiles/infrastructure/parameters/main.prod.bicepparam \
            --parameters containerImage="${{ secrets.CONTAINER_REGISTRY_HOSTNAME }}/attendr/attendr-profiles-api:${{ steps.gitversion.outputs.semVer }}"

      - name: Get deployment outputs
        working-directory: src/Profiles/Infrastructure
        run: |
          DEPLOYMENT_NAME=$(az deployment sub list --query "[?contains(name, 'profiles-service')].name" -o tsv | head -n 1)
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Infrastructure Deployed :cloud:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment:** $DEPLOYMENT_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          az deployment sub show \
            --name "$DEPLOYMENT_NAME" \
            --query properties.outputs

