<div class="account-preferences-container">
    <p-card header="Account Preferences">
        <div class="card-subtitle">
            <p>Manage your personal information and account settings</p>
        </div>

        @if (loading()) {
        <div class="loading-container">
            <p-progressSpinner styleClass="w-4rem h-4rem" strokeWidth="4" />
            <p>Loading profile...</p>
        </div>
        } @else {
        @if (error()) {
        <p-message severity="error" [text]="error()!" />
        }

        @if (successMessage()) {
        <p-message severity="success" [text]="successMessage()!" />
        }

        <form class="profile-form" (ngSubmit)="saveProfile()">
            <div class="form-field">
                <label for="displayName">Display Name *</label>
                <input pInputText id="displayName" [ngModel]="displayName()" (ngModelChange)="displayName.set($event)"
                    name="displayName" placeholder="Enter your display name" required />
            </div>

            <div class="form-field">
                <label for="firstName">First Name *</label>
                <input pInputText id="firstName" [ngModel]="firstName()" (ngModelChange)="firstName.set($event)"
                    name="firstName" placeholder="Enter your first name" required />
            </div>

            <div class="form-field">
                <label for="lastName">Last Name *</label>
                <input pInputText id="lastName" [ngModel]="lastName()" (ngModelChange)="lastName.set($event)"
                    name="lastName" placeholder="Enter your last name" required />
            </div>

            <div class="form-field">
                <label for="email">Email Address</label>
                <input pInputText id="email" [ngModel]="email()" name="email" placeholder="Email address" readonly
                    disabled />
                <small class="field-hint">Email address cannot be changed</small>
            </div>

            <div class="form-field">
                <label for="tagLine">Tagline</label>
                <input pInputText id="tagLine" [ngModel]="tagLine()" (ngModelChange)="tagLine.set($event)"
                    name="tagLine" placeholder="Enter a tagline (optional)" />
                <small class="field-hint">A short description about yourself</small>
            </div>

            <div class="form-field checkbox-field">
                <div class="field-content">
                    <label for="isSearchable">Searchable Profile</label>
                    <small class="field-hint">Allow other attendees to find your profile</small>
                </div>
                <div class="toggle-wrapper">
                    <input type="checkbox" role="switch" class="toggle-switch" id="isSearchable"
                        [checked]="isSearchable()" (change)="isSearchable.set($any($event.target).checked)"
                        name="isSearchable" />
                    <span class="toggle-label">{{ isSearchable() ? 'On' : 'Off' }}</span>
                </div>
            </div>

            <div class="form-actions">
                <p-button type="submit" label="Save Changes" icon="pi pi-save" [loading]="saving()"
                    [disabled]="saving() || loading()" />
            </div>
        </form>
        }
    </p-card>
</div>
