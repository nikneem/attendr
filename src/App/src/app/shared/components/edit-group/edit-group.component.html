<div class="edit-group-form">
    <div class="form-field">
        <label for="groupName">Group Name</label>
        <input id="groupName" type="text" pInputText [(ngModel)]="groupName" placeholder="Enter group name"
            [disabled]="isUpdating()" (keyup.enter)="onSubmit()" class="w-full" />
        @if (validationError()) {
        <small class="error-message">{{ validationError() }}</small>
        }
        <small class="help-text">Only alphanumeric characters and spaces allowed (3-100 characters)</small>
    </div>

    <div class="form-field">
        <div class="checkbox-field">
            <p-checkbox [(ngModel)]="isPublic" [binary]="true" inputId="isPublic" [disabled]="isPublicDisabled()" />
            <label for="isPublic">
                <strong>Public Group</strong>
                <span class="field-description">Anyone can see and join this group</span>
            </label>
        </div>
    </div>

    <div class="form-field">
        <div class="checkbox-field">
            <p-checkbox [(ngModel)]="isSearchable" [binary]="true" inputId="isSearchable" [disabled]="isUpdating()" (onChange)="onSearchableChange($event.checked)" />
            <label for="isSearchable">
                <strong>Searchable</strong>
                <span class="field-description">Group appears in search results</span>
            </label>
        </div>
    </div>

    <div class="form-actions">
        <button pButton label="Update Group" icon="pi pi-check" [loading]="isUpdating()"
            [disabled]="!groupName().trim() || isUpdating()" (click)="onSubmit()">
        </button>
    </div>
</div>
