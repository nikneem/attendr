<div class="create-conference-form">
    <div class="form-field">
        <label for="conferenceTitle">{{ 'CREATE_CONFERENCE.TITLE_LABEL' | translate }} <span class="required">*</span></label>
        <input id="conferenceTitle" type="text" pInputText [(ngModel)]="title" [placeholder]="'CREATE_CONFERENCE.TITLE_PLACEHOLDER' | translate"
            [disabled]="isCreating" class="w-full" />
    </div>

    <div class="form-row">
        <div class="form-field">
            <label for="conferenceCity">{{ 'CREATE_CONFERENCE.CITY_LABEL' | translate }}</label>
            <input id="conferenceCity" type="text" pInputText [(ngModel)]="city" [placeholder]="'CREATE_CONFERENCE.CITY_PLACEHOLDER' | translate"
                [disabled]="isCreating" class="w-full" />
        </div>

        <div class="form-field">
            <label for="conferenceCountry">{{ 'CREATE_CONFERENCE.COUNTRY_LABEL' | translate }}</label>
            <input id="conferenceCountry" type="text" pInputText [(ngModel)]="country" [placeholder]="'CREATE_CONFERENCE.COUNTRY_PLACEHOLDER' | translate"
                [disabled]="isCreating" class="w-full" />
        </div>
    </div>

    <div class="form-field">
        <label for="imageUrl">{{ 'CREATE_CONFERENCE.IMAGE_URL_LABEL' | translate }}</label>
        <input id="imageUrl" type="url" pInputText [(ngModel)]="imageUrl" [placeholder]="'CREATE_CONFERENCE.IMAGE_URL_PLACEHOLDER' | translate"
            [disabled]="isCreating" class="w-full" />
        <small class="help-text">{{ 'CREATE_CONFERENCE.IMAGE_URL_HINT' | translate }}</small>
    </div>

    <div class="form-field">
        <label for="dateRange">{{ 'CREATE_CONFERENCE.DATE_RANGE_LABEL' | translate }} <span class="required">*</span></label>
        <p-datepicker id="dateRange" [(ngModel)]="dateRange" selectionMode="range" [showIcon]="true"
            [disabled]="isCreating" dateFormat="yy-mm-dd" [placeholder]="'CREATE_CONFERENCE.DATE_RANGE_PLACEHOLDER' | translate" styleClass="w-full"
            [readonlyInput]="true" appendTo="body">
        </p-datepicker>
        <small class="help-text">{{ 'CREATE_CONFERENCE.DATE_RANGE_HINT' | translate }}</small>
    </div>

    <div class="sync-source-section">
        <div class="form-field checkbox-field">
            <p-checkbox [(ngModel)]="hasSyncSource" [binary]="true" inputId="hasSyncSource" [disabled]="isCreating">
            </p-checkbox>
            <label for="hasSyncSource">{{ 'CREATE_CONFERENCE.SYNC_SOURCE_LABEL' | translate }}</label>
        </div>

        @if (hasSyncSource) {
        <div class="sync-source-fields">
            <div class="form-field">
                <label for="syncSourceType">{{ 'CREATE_CONFERENCE.SOURCE_TYPE_LABEL' | translate }} <span class="required">*</span></label>
                <p-select id="syncSourceType" [(ngModel)]="syncSourceType" [options]="sourceTypeOptions"
                    [placeholder]="'CREATE_CONFERENCE.SOURCE_TYPE_PLACEHOLDER' | translate" [disabled]="isCreating" styleClass="w-full">
                </p-select>
            </div>

            <div class="form-field">
                <label for="syncSourceUrl">{{ 'CREATE_CONFERENCE.API_KEY_LABEL' | translate }} <span class="required">*</span></label>
                <input id="syncSourceUrl" type="text" pInputText [(ngModel)]="syncSourceUrl"
                    [placeholder]="'CREATE_CONFERENCE.API_KEY_PLACEHOLDER' | translate" [disabled]="isCreating" class="w-full" maxlength="256" />
            </div>
        </div>
        }
    </div>

    @if (validationError) {
    <div class="error-message">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ validationError }}</span>
    </div>
    }

    <div class="form-actions">
        <button pButton [label]="'CREATE_CONFERENCE.CREATE_BUTTON' | translate" icon="pi pi-check" [loading]="isCreating"
            [disabled]="!title.trim() || !dateRange || dateRange.length < 2 || isCreating" (click)="onSubmit()">
        </button>
    </div>
</div>
