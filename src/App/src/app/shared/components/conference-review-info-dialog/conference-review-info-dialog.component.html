<div class="review-info-dialog">
    <div class="info-icon">
        <i class="pi pi-info-circle"></i>
    </div>

    <div class="info-content">
        <h3>{{ 'CONFERENCE_REVIEW_INFO.TITLE' | translate }}</h3>
        <p class="conference-name">{{ conferenceTitle() }}</p>

        <div class="info-message">
            <p>{{ 'CONFERENCE_REVIEW_INFO.REVIEW_MESSAGE' | translate }}</p>

            <div class="notice-box">
                <i class="pi pi-eye-slash"></i>
                <div>
                    <strong>{{ 'CONFERENCE_REVIEW_INFO.HIDDEN_NOTICE_TITLE' | translate }}</strong>
                    <p>{{ 'CONFERENCE_REVIEW_INFO.HIDDEN_NOTICE_DESC' | translate }}</p>
                </div>
            </div>

            <!-- <p class="footer-note">
                We'll notify you once the review is complete and your conference becomes publicly visible.
            </p> -->
        </div>
    </div>

    <div class="dialog-actions">
        <button pButton [label]="'CONFERENCE_REVIEW_INFO.GOT_IT' | translate" icon="pi pi-check" (click)="onClose()" styleClass="p-button-primary"></button>
    </div>
</div>
